[metadata]
creation_date = "2025/12/16"
integration = ["endpoint", "windows"]
maturity = "production"
updated_date = "2025/12/16"

[rule]
author = ["Metis Intelligence"]
description = """
Detects successful logon events for the user "ubuntu". This rule monitors for authentication success events
that may indicate unauthorized access attempts or suspicious login activity involving the ubuntu user account.
Monitor for unusual login patterns, times, or sources that deviate from normal behavior.
"""
from = "now-9m"
index = ["logs-endpoint.events.process-*", "logs-system.auth-*", "logs-windows.*", "winlogbeat-*"]
language = "eql"
license = "Elastic License v2"
max_signals = 10
name = "Successful Logon from Ubuntu User Account"
note = """## Triage and analysis

### Investigating Successful Logon from Ubuntu User Account

This rule identifies successful authentication events for the ubuntu user account. While ubuntu is a common default user account on Linux systems, successful logins from this account may indicate:

#### Possible investigation steps

- **Verify legitimacy**: Confirm if this login was expected and authorized
  - Check the source IP address and geolocation
  - Review the login time and frequency pattern
  - Validate if this aligns with normal user behavior

- **Check system context**: Examine the host and environment details
  - Is this a production system or development environment?
  - Review recent system changes or deployments
  - Check for other concurrent suspicious activities

- **Analyze authentication method**: Review how the login occurred
  - Was it password-based, key-based, or other authentication method?
  - Check for brute force attempts preceding this login
  - Review authentication logs for patterns

- **Assess impact**: Determine the scope of potential compromise
  - What actions were taken after login?
  - Check for privilege escalation attempts
  - Review file access and command execution patterns

- **Security monitoring**: Enhance monitoring for this user
  - Consider renaming default accounts
  - Implement stricter access controls
  - Enable additional logging and alerting

### False positive analysis

- **Expected administrative access**: Legitimate system administration activities
- **Automated processes**: Scheduled tasks or scripts using ubuntu credentials
- **Development environments**: Common in non-production systems

### Response and remediation

- **Immediate response**: If unauthorized, isolate the affected system
- **Credential review**: Rotate credentials and review access patterns
- **System hardening**: Implement least privilege and additional security controls
- **Audit enhancement**: Improve logging and monitoring capabilities
"""
references = [
    "https://attack.mitre.org/techniques/T1078/002/",
    "https://attack.mitre.org/techniques/T1078/003/",
    "https://www.elastic.co/guide/en/security/current/valid-accounts.html"
]
risk_score = 47
rule_id = "credential_access_ubuntu_successful_logon"
severity = "low"
tags = ["Domain: Endpoint", "OS: Linux", "OS: Windows", "Use Case: Threat Detection", "Tactic: Initial Access", "Tactic: Privilege Escalation", "Resources: Investigation Guide", "Data Source: Authentication Logs"]
timestamp_override = "event.ingested"
type = "eql"

query = '''
process where host.os.type == "linux" and event.action == "start" and
  (process.name : ("login", "sshd", "sudo", "su") or
   process.executable : ("*login*", "*sshd*", "*sudo*", "*su*")) and
  (process.args : "*ubuntu*" or process.working_directory : "*ubuntu*")
'''

[[rule.filters]]
[rule.filters.query]
query = '''
host.os.type : "linux" or host.os.type : "windows"
'''
