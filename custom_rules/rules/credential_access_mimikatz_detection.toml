[metadata]
creation_date = "2025/12/15"
integration = ["endpoint", "windows"]
maturity = "production"
updated_date = "2025/12/15"

[rule]
author = ["Metis Intelligence"]
description = """
Identifies the execution of Mimikatz, a well-known post-exploitation tool used for credential theft and lateral movement.
Mimikatz can extract plaintext passwords, Kerberos tickets, and other sensitive credentials from memory. This rule
detects various indicators of Mimikatz execution including process creation, command line patterns, and suspicious
behavior associated with credential dumping activities.
"""
from = "now-9m"
index = ["logs-endpoint.events.process-*", "logs-endpoint.events.registry-*", "logs-endpoint.events.file-*", "winlogbeat-*"]
language = "eql"
license = "Elastic License v2"
max_signals = 10
name = "Mimikatz Credential Dumping Tool Detected"
note = """## Triage and analysis

### Investigating Mimikatz Credential Dumping Tool Detected

This rule identifies the execution of Mimikatz, a powerful post-exploitation tool commonly used by attackers to extract
credentials from Windows systems. Detection is based on multiple indicators including process execution, command line
patterns, and suspicious file/registry access.

#### Possible investigation steps

- **Confirm Mimikatz execution**: Verify the process details and command line arguments
  - Check if the executable is located in a suspicious directory
  - Review command line parameters for credential dumping functions
  - Validate the file hash against known Mimikatz signatures

- **Analyze process behavior**: Examine parent-child process relationships
  - Identify how Mimikatz was executed (PowerShell, cmd, etc.)
  - Check for lateral movement indicators
  - Look for privilege escalation attempts

- **Review credential access patterns**: Examine what credentials were targeted
  - Check for LSASS memory access
  - Look for SAM registry hive access
  - Identify which user accounts were compromised

- **Assess the impact**: Determine the scope of credential compromise
  - Review authentication logs for suspicious activity
  - Check for lateral movement using stolen credentials
  - Identify other systems that may be affected

- **Examine the attack chain**: Understand how Mimikatz was deployed
  - Check for initial access vectors
  - Look for other post-exploitation tools
  - Review network connections to C2 servers

### False positive analysis

- **Legitimate security tools**: Some legitimate security and system administration tools may trigger similar patterns
- **Penetration testing**: Authorized security assessments may use Mimikatz-like tools
- **Debugging activities**: System administrators or developers may use credential dumping tools for troubleshooting

### Response and remediation

- **Immediate containment**: Isolate affected systems and revoke compromised credentials
- **Credential rotation**: Reset passwords for all potentially compromised accounts
- **System cleanup**: Remove any backdoors or persistence mechanisms
- **Log analysis**: Review authentication logs for suspicious activity
- **Network monitoring**: Monitor for lateral movement using stolen credentials

### Additional resources

- [Mimikatz on MITRE ATT&CK](https://attack.mitre.org/software/S0002/)
- [Credential Dumping Techniques](https://attack.mitre.org/techniques/T1003/)
"""
references = [
    "https://attack.mitre.org/software/S0002/",
    "https://attack.mitre.org/techniques/T1003/",
    "https://www.elastic.co/guide/en/security/current/mimikatz-detection.html"
]
risk_score = 99
rule_id = "credential_access_mimikatz_detection"
severity = "critical"
tags = ["Domain: Endpoint", "OS: Windows", "Use Case: Threat Detection", "Tactic: Credential Access", "Resources: Investigation Guide"]
threat = [{framework = "MITRE ATT&CK", technique = ["T1003", "T1003.001", "T1003.002", "T1003.003", "T1003.004", "T1003.005", "T1003.006"], tactic = ["TA0006"]}]
timestamp_override = "event.ingested"
type = "eql"

query = '''
/* Mimikatz process execution */
process where event.type == "start" and
  (process.name : ("mimikatz.exe", "mimikatz64.exe", "mimidrv.sys", "mimilib.dll") or
   process.executable : ("*\\mimikatz*", "*\\mimi*", "*\\mimilib*") or
   process.command_line : ("*mimikatz*", "*privilege::debug*", "*sekurlsa::*", "*lsadump::*", "*samdump::*", "*dpapi::*", "*kerberos::*"))
or

/* Suspicious process accessing LSASS */
process where event.type in ("access", "start") and process.name != "lsass.exe" and
  (process.parent.executable : ("*\\mimikatz*", "*\\powershell.exe", "*\\cmd.exe") or
   process.command_line : ("*mimikatz*", "*sekurlsa*", "*lsadump*")) and
  host.os.type == "windows" and
  process.Ext.memory_region.target_path : "C:\\Windows\\System32\\lsass.exe"
or

/* Registry access patterns typical of Mimikatz */
registry where event.type in ("access", "modification") and
  (registry.path : ("HKLM\\SAM\\*", "HKLM\\SECURITY\\*", "HKLM\\SYSTEM\\CurrentControlSet\\Control\\Lsa\\*") or
   registry.key : "*\\SAM\\*", "*\\SECURITY\\*", "*\\Lsa\\*") and
  (process.name : ("mimikatz.exe", "mimikatz64.exe") or
   process.executable : ("*\\mimikatz*", "*\\powershell.exe", "*\\cmd.exe") or
   process.command_line : ("*mimikatz*", "*sekurlsa*", "*lsadump*", "*samdump*"))
or

/* File access to sensitive system files */
file where event.type in ("access", "creation", "modification") and
  (file.path : ("C:\\Windows\\System32\\config\\SAM", "C:\\Windows\\System32\\config\\SECURITY", "C:\\Windows\\System32\\config\\SYSTEM") or
   file.name : ("SAM", "SECURITY", "SYSTEM")) and
  (process.name : ("mimikatz.exe", "mimikatz64.exe") or
   process.executable : ("*\\mimikatz*", "*\\powershell.exe", "*\\cmd.exe") or
   process.command_line : ("*mimikatz*", "*sekurlsa*", "*lsadump*", "*samdump*"))
or

/* Suspicious PowerShell execution with Mimikatz patterns */
process where event.type == "start" and
  process.name == "powershell.exe" and
  process.command_line : ("*mimikatz*", "*sekurlsa*", "*lsadump*", "*privilege::debug*", "*Invoke-Mimikatz*", "*DumpCreds*", "*DumpHashes*")
'''

[[rule.filters]]
[rule.filters.query]
query = '''
host.os.type : "windows"
'''
