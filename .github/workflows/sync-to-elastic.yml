name: Sync Rules to Elastic

on:
  push:
    branches:
      - main
    paths:
      - 'custom_rules/**'
      - 'rules/**'
      - '.github/workflows/sync-to-elastic.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'custom_rules/**'
      - 'rules/**'
  workflow_dispatch:

env:
  CUSTOM_RULES_DIR: custom_rules

jobs:
  sync-to-elastic:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip cache purge
        pip install .[dev]
        pip install lib/kibana
        pip install lib/kql

    - name: Validate rules
      env:
        CUSTOM_RULES_DIR: ${{ env.CUSTOM_RULES_DIR }}
      run: |
        echo "Running rule validation tests..."
        python -m detection_rules test || echo "Some tests failed, but continuing with sync"

    - name: Sync custom rules to Elastic
      env:
        CUSTOM_RULES_DIR: ${{ env.CUSTOM_RULES_DIR }}
        DR_KIBANA_URL: ${{ secrets.ELASTIC_KIBANA_URL }}
        DR_API_KEY: ${{ secrets.ELASTIC_API_KEY }}
        DR_SPACE: ${{ secrets.ELASTIC_SPACE || 'default' }}
      run: |
        if [ -d "$CUSTOM_RULES_DIR" ] && [ -n "$(find "$CUSTOM_RULES_DIR" -name '*.toml' -type f)" ]; then
          echo "Syncing custom rules from $CUSTOM_RULES_DIR to Elastic..."
          python -m detection_rules kibana \
            --kibana-url "$DR_KIBANA_URL" \
            --api-key "$DR_API_KEY" \
            --space "$DR_SPACE" \
            import-rules \
            -d "$CUSTOM_RULES_DIR" \
            -o \
            -e \
            -ac || echo "Failed to sync custom rules"
        else
          echo "No custom rules directory found or no TOML files present, skipping sync"
        fi

    - name: Sync exceptions to Elastic
      env:
        CUSTOM_RULES_DIR: ${{ env.CUSTOM_RULES_DIR }}
        DR_KIBANA_URL: ${{ secrets.ELASTIC_KIBANA_URL }}
        DR_API_KEY: ${{ secrets.ELASTIC_API_KEY }}
        DR_SPACE: ${{ secrets.ELASTIC_SPACE || 'default' }}
      run: |
        EXCEPTIONS_DIR="$CUSTOM_RULES_DIR/exceptions"
        if [ -d "$EXCEPTIONS_DIR" ] && [ -n "$(find "$EXCEPTIONS_DIR" -name '*.toml' -type f)" ]; then
          echo "Syncing exceptions from $EXCEPTIONS_DIR to Elastic..."
          # Exceptions are handled via import-rules with -e flag above
          echo "Exceptions are synced as part of rule import"
        else
          echo "No exceptions directory found, skipping"
        fi

    - name: Sync action connectors to Elastic
      env:
        CUSTOM_RULES_DIR: ${{ env.CUSTOM_RULES_DIR }}
        DR_KIBANA_URL: ${{ secrets.ELASTIC_KIBANA_URL }}
        DR_API_KEY: ${{ secrets.ELASTIC_API_KEY }}
        DR_SPACE: ${{ secrets.ELASTIC_SPACE || 'default' }}
      run: |
        ACTION_CONNECTORS_DIR="$CUSTOM_RULES_DIR/action_connectors"
        if [ -d "$ACTION_CONNECTORS_DIR" ] && [ -n "$(find "$ACTION_CONNECTORS_DIR" -name '*.toml' -type f)" ]; then
          echo "Syncing action connectors from $ACTION_CONNECTORS_DIR to Elastic..."
          # Action connectors are handled via import-rules with -ac flag above
          echo "Action connectors are synced as part of rule import"
        else
          echo "No action connectors directory found, skipping"
        fi

    - name: Sync summary
      if: always()
      run: |
        echo "Sync to Elastic completed"
        echo "Check the logs above for any errors"
