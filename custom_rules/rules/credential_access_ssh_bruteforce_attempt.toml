[metadata]
creation_date = "2025/12/15"
integration = ["system"]
maturity = "production"
updated_date = "2025/12/15"

[rule]
author = ["Metis Intelligence"]
description = """
Identifies multiple consecutive SSH login failures from the same source IP address within a short time interval.
This rule detects brute force attempts where an attacker tries multiple username/password combinations to gain
unauthorized access to SSH services. The rule triggers when 10 or more failed login attempts occur from the
same source IP within a 15-second window.
"""
from = "now-9m"
index = ["filebeat-*", "logs-system.auth-*"]
language = "eql"
license = "Elastic License v2"
max_signals = 5
name = "SSH Brute Force Attempt Detected"
note = """## Triage and analysis

### Investigating SSH Brute Force Attempt Detected

This rule identifies consecutive SSH login failures from the same source IP address, indicating a brute force attack
attempt. Attackers commonly use automated tools to try multiple username/password combinations in rapid succession.

#### Possible investigation steps

- **Review the source IP address**: Check if the IP is known to be malicious or part of a botnet
  - Use threat intelligence feeds to check the reputation of the source IP
  - Review geolocation data to identify unusual geographic origins
  
- **Analyze the target user accounts**: Determine which usernames were targeted
  - Check if privileged accounts (root, admin) were targeted
  - Identify if the attack targeted multiple users or focused on specific accounts
  
- **Examine the timeline**: Review the pattern and frequency of attempts
  - Determine if this is part of a larger campaign
  - Check for successful logins following the failed attempts
  
- **Review related alerts**: Check for other security events associated with the source IP or target host
  - Look for successful authentication events from the same source
  - Check for other attack patterns from the same IP
  
- **Assess the target system**: Evaluate the security posture of the affected host
  - Verify if SSH is properly configured (key-based auth, fail2ban, etc.)
  - Check if the system has been compromised

### False positive analysis

- **Legitimate authentication issues**: 
  - Service account password expiration
  - Misconfigured authentication systems
  - Network connectivity issues causing repeated connection attempts
  
- **Automated systems**:
  - CI/CD pipelines with incorrect credentials
  - Monitoring systems attempting to connect
  - Backup systems with authentication failures

### Response and remediation

- **Immediate actions**:
  - Block the source IP address at the firewall or using fail2ban
  - Review logs for any successful authentication following the brute force attempts
  - If successful login detected, immediately terminate the session and reset credentials
  
- **Short-term actions**:
  - Implement rate limiting for SSH connections
  - Enable key-based authentication and disable password authentication if possible
  - Configure fail2ban or similar tools to automatically block brute force attempts
  - Review and strengthen password policies
  
- **Long-term actions**:
  - Implement multi-factor authentication (MFA) for SSH access
  - Restrict SSH access to specific IP ranges using firewall rules
  - Regularly review and update SSH configuration
  - Monitor and alert on authentication failures
  - Conduct security awareness training on strong password practices

### Related Rules

- Potential Internal Linux SSH Brute Force Detected - 1c27fa22-7727-4dd3-81c0-de6da5555feb
- Potential External Linux SSH Brute Force Detected - fa210b61-b627-4e5e-86f4-17e8270656ab
- Potential Successful SSH Brute Force Attack - (check for successful login after failures)
"""
risk_score = 47
rule_id = "f9a2b7ca-309e-4038-ae29-81f9d18ee7ae"
setup = """## Setup

This rule requires data coming in from Filebeat with the System Module enabled.

### Filebeat Setup

Filebeat is a lightweight shipper for forwarding and centralizing log data. Installed as an agent on your servers,
Filebeat monitors the log files or locations that you specify, collects log events, and forwards them either to
Elasticsearch or Logstash for indexing.

#### The following steps should be executed in order to add Filebeat on a Linux System:

- Elastic provides repositories available for APT and YUM-based distributions. Note that we provide binary packages,
  but no source packages.
- To install the APT and YUM repositories follow the setup instructions in this [helper guide](https://www.elastic.co/guide/en/beats/filebeat/current/setup-repositories.html).
- To run Filebeat on Docker follow the setup instructions in the [helper guide](https://www.elastic.co/guide/en/beats/filebeat/current/running-on-docker.html).
- To run Filebeat on Kubernetes follow the setup instructions in the [helper guide](https://www.elastic.co/guide/en/beats/filebeat/current/running-on-kubernetes.html).
- For quick start information for Filebeat refer to the [helper guide](https://www.elastic.co/guide/en/beats/filebeat/8.11/filebeat-installation-configuration.html).
- For complete "Setup and Run Filebeat" information refer to the [helper guide](https://www.elastic.co/guide/en/beats/filebeat/current/setting-up-and-running.html).

#### Rule Specific Setup Note

- This rule requires the "Filebeat System Module" to be enabled.
- The system module collects and parses logs created by the system logging service of common Unix/Linux based distributions.
- To run the system module of Filebeat on Linux follow the setup instructions in the [helper guide](https://www.elastic.co/guide/en/beats/filebeat/current/filebeat-module-system.html).
- Ensure SSH authentication logs are being collected and properly parsed by Filebeat.
"""
severity = "medium"
tags = ["Domain: Endpoint", "OS: Linux", "Use Case: Threat Detection", "Tactic: Credential Access", "Resources: Investigation Guide", "Custom Rule"]
type = "eql"

query = '''
sequence by host.id, source.ip with maxspan=15s
  [ authentication where host.os.type == "linux" and 
   event.action in ("ssh_login", "user_login") and event.outcome == "failure" ] with runs = 10
'''

[[rule.threat]]
framework = "MITRE ATT&CK"
[[rule.threat.technique]]
id = "T1110"
name = "Brute Force"
reference = "https://attack.mitre.org/techniques/T1110/"
[[rule.threat.technique.subtechnique]]
id = "T1110.001"
name = "Password Guessing"
reference = "https://attack.mitre.org/techniques/T1110/001/"

[[rule.threat.technique.subtechnique]]
id = "T1110.003"
name = "Password Spraying"
reference = "https://attack.mitre.org/techniques/T1110/003/"

[rule.threat.tactic]
id = "TA0006"
name = "Credential Access"
reference = "https://attack.mitre.org/tactics/TA0006/"

