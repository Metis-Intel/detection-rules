[metadata]
creation_date = "2025/12/17"
integration = ["endpoint", "windows"]
maturity = "production"
updated_date = "2025/12/17"

[rule]
author = ["Detection Rules Test Suite"]
description = """
Test rule for suspicious network connections converted from Sigma format.
Detects outbound connections to known malicious ports and dark web domains.
Generated from: Test - Suspicious Network Connections
"""
from = "now-9m"
index = ["logs-endpoint.events.network-*", "winlogbeat-*"]
language = "eql"
license = "Elastic License v2"
max_signals = 10
name = "Sigma Test - Suspicious Network Connections (Auto-Converted)"
note = """## Triage and analysis

### Investigating Suspicious Network Connections

This rule detects outbound network connections to suspicious destinations including:
- Common command and control ports (4444, 6667, 9999, 1337, 31337)
- Dark web domains (.onion, .tor, .bit, .i2p)

#### Possible investigation steps

- Verify the destination IP/domain legitimacy
- Check the connecting process and user
- Analyze network traffic patterns
- Review firewall logs for related connections

#### False positive analysis

- Legitimate network scanning tools
- Penetration testing activities
- Gaming applications
- Research and security testing

### Response and remediation

- Block suspicious connections at network perimeter
- Isolate affected hosts for investigation
- Check for additional indicators of compromise
- Monitor for data exfiltration attempts

### Additional resources

- Generated by Sigma multi-SIEM framework
- https://github.com/SigmaHQ/sigma
- https://attack.mitre.org/techniques/T1071/
"""
references = [
    "https://github.com/SigmaHQ/sigma",
    "https://attack.mitre.org/techniques/T1071/",
    "https://attack.mitre.org/techniques/T1041/"
]
risk_score = 73
rule_id = "sigma_test_network_connections_auto_converted"
severity = "high"
tags = ["Domain: Endpoint", "OS: Windows", "Use Case: Threat Detection", "Tactic: Command and Control", "Tactic: Exfiltration", "Data Source: Network Traffic", "Sigma: Auto-Converted"]
type = "eql"

query = '''
any where network.direction:"egress" and destination.port in (4444, 6667, 9999, 1337, 31337) and destination.domain like~ ("*.onion", "*.tor", "*.bit", "*.i2p")
'''
